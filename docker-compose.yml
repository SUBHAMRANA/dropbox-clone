# docker-compose.yml
version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: dropbox_db
    environment:
      POSTGRES_DB: dropbox
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: